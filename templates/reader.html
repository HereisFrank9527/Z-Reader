<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#f6f7f9">
    <title>Z Reader - 在线阅读器</title>
    <link rel="icon" href="/static/icon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/static/icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 阅读器特定样式 */
        .reader-container {
            display: flex;
            height: calc(100vh - 40px);
            margin-top: 20px;
        }

        .reader-sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 20px;
        }

        .reader-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .reader-header {
            background: #0f766e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .reader-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 16px;
        }

        .chapter-list {
            list-style: none;
            padding: 0;
        }

        .chapter-item {
            padding: 10px 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .chapter-item:hover {
            background: #e9ecef;
            border-color: #0f766e;
        }

        .chapter-item.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
        }

        .chapter-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #ddd;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(21, 31, 46, 0.08);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-prev {
            background: #475569;
            color: white;
        }

        .nav-next {
            background: #0f766e;
            color: white;
        }

        .book-info {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .book-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .book-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }

        .chapter-content h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #0f766e;
            padding-bottom: 10px;
        }

        .chapter-content p {
            margin-bottom: 15px;
            text-indent: 2em;
        }

        /* Sidebar toggle button */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0f766e;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 12px 28px rgba(21, 31, 46, 0.08);
            transition: all 0.3s ease;
        }

        .sidebar-toggle:hover {
            background: #5a6fd8;
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(21, 31, 46, 0.12);
        }

        /* Mobile sidebar backdrop */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .sidebar-backdrop.show {
            display: block;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar-toggle {
                display: block;
            }
            
            .reader-container {
                position: relative;
                height: calc(100vh - 120px);
            }

            .reader-sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 280px;
                max-width: 85vw;
                height: 100vh;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
                background: #f8f9fa;
                border-right: 1px solid #ddd;
                overflow-y: auto;
                padding: 60px 20px 20px 20px;
            }
            
            .reader-sidebar.open {
                transform: translateX(0);
            }

            .reader-main {
                margin-left: 0;
                min-height: 60vh;
            }

            .reader-content {
                padding: 20px;
                font-size: 14px;
            }

            .chapter-navigation {
                padding: 15px 20px;
            }

            .nav-btn {
                padding: 8px 15px;
                font-size: 0.9em;
            }

        }

        /* 关闭按钮 */
        .close-button {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1002;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .close-button:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }

        /* 字体大小控制 */
        .font-size-controls {
            position: fixed;
            bottom: 100px;
            right: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 12px 28px rgba(21, 31, 46, 0.08);
            z-index: 100;
        }

        .font-size-btn {
            background: #0f766e;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s;
        }

        .font-size-btn:hover {
            transform: scale(1.1);
        }

        /* TTS 控制面板 */
        .tts-controls {
            position: fixed;
            bottom: 140px;
            right: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 12px 28px rgba(21, 31, 46, 0.08);
            z-index: 100;
            min-width: 280px;
            max-width: 320px;
        }

        .tts-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .tts-title {
            font-weight: bold;
            color: #333;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tts-status {
            font-size: 0.8em;
            padding: 2px 8px;
            border-radius: 6px;
            background: #f0f0f0;
            color: #666;
        }

        .tts-status.playing {
            background: #e8f5e9;
            color: #4caf50;
        }

        .tts-status.paused {
            background: #fff3e0;
            color: #ff9800;
        }

        .tts-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tts-btn {
            background: #0f766e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
        }

        .tts-btn:hover:not(:disabled) {
            background: #5a6fd8;
            transform: translateY(-1px);
        }

        .tts-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tts-btn.stop {
            background: #f44336;
        }

        .tts-btn.stop:hover:not(:disabled) {
            background: #d32f2f;
        }

        .tts-settings {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tts-setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tts-setting-label {
            font-size: 0.85em;
            color: #666;
            min-width: 60px;
        }

        .tts-voice-select, .tts-speed-slider {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.85em;
        }

        .tts-speed-value {
            font-size: 0.8em;
            color: #0f766e;
            font-weight: bold;
            min-width: 35px;
            text-align: right;
        }

        .tts-progress {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .tts-progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin: 5px 0;
        }

        .tts-progress-fill {
            height: 100%;
            background: #0f766e;
            transition: width 0.3s;
            width: 0%;
        }

        .tts-progress-text {
            font-size: 0.8em;
            color: #666;
            text-align: center;
        }

        /* 文本高亮 */
        .tts-highlight {
            background: #fff7c2;
            border-radius: 3px;
            padding: 2px 4px;
            transition: all 0.3s;
        }

        /* TTS 切换按钮 */
        .tts-toggle-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #0f766e;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(21, 31, 46, 0.08);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
        }

        .tts-toggle-btn:hover {
            background: #5a6fd8;
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(21, 31, 46, 0.12);
        }

        .tts-toggle-btn.active {
            background: #4caf50;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .tts-controls {
                bottom: 100px;
                right: 10px;
                left: 10px;
                min-width: auto;
                max-width: none;
            }

            .tts-toggle-btn {
                bottom: 60px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .font-size-controls {
                bottom: 120px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 侧边栏切换按钮 -->
    <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
    
    <!-- 关闭按钮 -->
    <button class="close-button" id="close-button" onclick="window.close()">×</button>
    
    <!-- 移动端侧边栏背景遮罩 -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    
    <div class="container">
        <!-- 阅读器容器 -->
        <div class="reader-container">
            <!-- 侧边栏 -->
            <div class="reader-sidebar">
                <div class="book-info">
                    <div class="book-title" id="book-title">加载中...</div>
                    <div class="book-meta" id="book-source">来源：{{ source_name }}</div>
                    <div class="book-meta" id="book-author">作者：加载中...</div>
                    <div class="book-meta" id="book-status">状态：加载中...</div>
                    <div class="book-meta" id="chapter-count">章节数：加载中...</div>
                </div>
                
                <div style="margin-top: 20px;">
                    <h3 style="margin-bottom: 15px; color: #333;">章节列表</h3>
                    <ul class="chapter-list" id="chapter-list">
                        <li style="text-align: center; color: #888; padding: 20px;">
                            <div class="spinner"></div>
                            <p>加载章节列表中...</p>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="reader-main">
                <div class="reader-content">
                    <div id="chapter-content" class="chapter-content">
                        <p style="text-align: center; color: #888; margin-top: 50px;">
                            请从左侧章节列表选择要阅读的章节
                        </p>
                    </div>
                </div>

                <!-- 章节导航 -->
                <div class="chapter-navigation" id="chapter-navigation" style="display: none;">
                    <button class="nav-btn nav-prev" id="prev-chapter" onclick="loadPrevChapter()">
                        ← 上一章
                    </button>
                    <span id="chapter-progress" style="color: #666;">第 1 / 1 章</span>
                    <button class="nav-btn nav-next" id="next-chapter" onclick="loadNextChapter()">
                        下一章 →
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>

    <!-- 字体大小控制 -->
    <div class="font-size-controls">
        <button class="font-size-btn" onclick="changeFontSize(-1)">A-</button>
        <button class="font-size-btn" onclick="changeFontSize(1)">A+</button>
    </div>

    <!-- TTS 切换按钮 -->
    <button class="tts-toggle-btn" id="tts-toggle-btn" onclick="toggleTTSPanel()" title="语音朗读">
        🔊
    </button>

    <!-- TTS 控制面板 -->
    <div class="tts-controls" id="tts-controls" style="display: none;">
        <div class="tts-header">
            <div class="tts-title">
                <span>🔊</span>
                <span>语音朗读</span>
            </div>
            <div class="tts-status" id="tts-status">未开始</div>
        </div>
        
        <div class="tts-buttons">
            <button class="tts-btn" id="tts-play-btn" onclick="toggleTTSPlay()" disabled>
                <span>▶️</span>
                <span>播放</span>
            </button>
            <button class="tts-btn" id="tts-pause-btn" onclick="pauseTTS()" disabled>
                <span>⏸️</span>
                <span>暂停</span>
            </button>
            <button class="tts-btn stop" id="tts-stop-btn" onclick="stopTTS()" disabled>
                <span>⏹️</span>
                <span>停止</span>
            </button>
        </div>

        <div class="tts-settings">
            <div class="tts-setting-row">
                <label class="tts-setting-label">语音:</label>
                <select class="tts-voice-select" id="tts-voice-select">
                    <option value="">加载中...</option>
                </select>
            </div>
            
            <div class="tts-setting-row">
                <label class="tts-setting-label">语速:</label>
                <input type="range" class="tts-speed-slider" id="tts-speed-slider" 
                       min="0.5" max="4.0" step="0.1" value="1.0">
                <span class="tts-speed-value" id="tts-speed-value">1.0x</span>
            </div>

            <div class="tts-setting-row">
                <label class="tts-setting-label">自动下一章:</label>
                <input type="checkbox" id="tts-auto-next-chapter" checked>
            </div>
        </div>

        <div class="tts-progress">
            <div class="tts-progress-bar">
                <div class="tts-progress-fill" id="tts-progress-fill"></div>
            </div>
            <div class="tts-progress-text" id="tts-progress-text">准备就绪</div>
        </div>
    </div>

    <script>
        // 全局变量
        let sourceId = {{ source_id }};
        let bookUrl = '{{ book_url }}';
        let bookData = null;
        let chapters = [];
        let currentChapterIndex = -1;
        let currentFontSize = 16;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadBookInfo();
            initMobileSidebar();
        });

        // 初始化移动端侧边栏功能
        function initMobileSidebar() {
            const sidebarToggle = document.getElementById('sidebar-toggle');
            const sidebar = document.querySelector('.reader-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (sidebarToggle && sidebar && backdrop) {
                // 切换侧边栏开关状态
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('open');
                    backdrop.classList.toggle('show');
                });
                
                // 点击背景遮罩关闭侧边栏
                backdrop.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    backdrop.classList.remove('show');
                });
                
                // 窗口大小改变时的处理
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        sidebar.classList.remove('open');
                        backdrop.classList.remove('show');
                    }
                });
                
                // 点击章节项后自动关闭侧边栏（移动端）
                const chapterItems = document.querySelectorAll('.chapter-item');
                chapterItems.forEach(item => {
                    item.addEventListener('click', function() {
                        if (window.innerWidth <= 768) {
                            setTimeout(() => {
                                sidebar.classList.remove('open');
                                backdrop.classList.remove('show');
                            }, 300); // 短暂延迟以确保章节已加载
                        }
                    });
                });
            }
        }

        // 加载书籍信息
        async function loadBookInfo() {
            try {
                const response = await fetch('/api/reader/book', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        source_id: sourceId,
                        book_url: bookUrl
                    })
                });

                const result = await response.json();

                if (result.success) {
                    bookData = result.data;
                    chapters = result.data.chapters || [];
                    
                    updateBookInfo();
                    renderChapterList();
                } else {
                    showError('加载书籍信息失败: ' + result.message);
                }
            } catch (error) {
                showError('加载书籍信息失败: ' + error.message);
            }
        }

        // 更新书籍信息显示
        function updateBookInfo() {
            document.getElementById('book-title').textContent = bookData.book_name || '未知书名';
            document.getElementById('book-author').textContent = '作者：' + (bookData.author || '未知');
            document.getElementById('book-status').textContent = '状态：' + (bookData.status || '未知');
            document.getElementById('chapter-count').textContent = '章节数：' + chapters.length;
        }

        // 渲染章节列表
        function renderChapterList() {
            const chapterList = document.getElementById('chapter-list');
            
            if (chapters.length === 0) {
                chapterList.innerHTML = '<li style="text-align: center; color: #888; padding: 20px;">暂无章节</li>';
                return;
            }

            chapterList.innerHTML = chapters.map((chapter, index) => `
                <li class="chapter-item ${index === currentChapterIndex ? 'active' : ''}" 
                    onclick="loadChapter(${index})">
                    ${chapter.title}
                </li>
            `).join('');

            // 重新绑定章节点击事件
            const chapterItems = document.querySelectorAll('.chapter-item');
            chapterItems.forEach(item => {
                item.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        setTimeout(() => {
                            const sidebar = document.querySelector('.reader-sidebar');
                            const backdrop = document.getElementById('sidebar-backdrop');
                            sidebar.classList.remove('open');
                            backdrop.classList.remove('show');
                        }, 300);
                    }
                });
            });
        }

        // 加载章节内容
        async function loadChapter(chapterIndex) {
            if (chapterIndex < 0 || chapterIndex >= chapters.length) {
                return;
            }

            currentChapterIndex = chapterIndex;
            const chapter = chapters[chapterIndex];

            // 更新章节列表激活状态
            updateChapterListActive();

            // 显示加载状态
            showLoading();
           
            document.getElementById('chapter-content').innerHTML = `
                <p style="text-align: center; color: #888;">
                    <div class="spinner" style="margin: 20px auto;"></div>
                    <p>正在加载章节内容...</p>
                </p>
            `;

            try {
                const response = await fetch('/api/reader/chapter', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        source_id: sourceId,
                        chapter_url: chapter.url
                    })
                });

                const result = await response.json();

                if (result.success) {
                    displayChapter(result.data);
                    updateNavigation();
                } else {
                    showError('加载章节失败: ' + result.message);
                }
            } catch (error) {
                showError('加载章节失败: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // 显示章节内容
        function displayChapter(chapterData) {
            let content = chapterData.content || '章节内容为空';
            
            // 处理段落格式
            content = content.replace(/\n/g, '</p><p>');
            content = '<p>' + content + '</p>';
            
            document.getElementById('chapter-content').innerHTML = `
                <div class="chapter-content">
                    <h1>${chapterData.title || '未知章节'}</h1>
                    <div>${content}</div>
                </div>
            `;

            // 显示导航栏
            document.getElementById('chapter-navigation').style.display = 'flex';
        }

        // 更新章节列表激活状态
        function updateChapterListActive() {
            const items = document.querySelectorAll('.chapter-item');
            items.forEach((item, index) => {
                if (index === currentChapterIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // 滚动到当前章节
            if (currentChapterIndex >= 0) {
                const activeItem = document.querySelector('.chapter-item.active');
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // 更新导航按钮状态
        function updateNavigation() {
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            const progress = document.getElementById('chapter-progress');

            // 更新进度显示
            progress.textContent = `第 ${currentChapterIndex + 1} / ${chapters.length} 章`;

            // 更新按钮状态
            prevBtn.disabled = currentChapterIndex <= 0;
            nextBtn.disabled = currentChapterIndex >= chapters.length - 1;
        }

        // 加载上一章
        function loadPrevChapter() {
            if (currentChapterIndex > 0) {
                loadChapter(currentChapterIndex - 1);
            }
        }

        // 加载下一章
        function loadNextChapter() {
            if (currentChapterIndex < chapters.length - 1) {
                loadChapter(currentChapterIndex + 1);
            }
        }

        // 改变字体大小
        function changeFontSize(delta) {
            currentFontSize += delta;
            currentFontSize = Math.max(12, Math.min(24, currentFontSize));
            
            const content = document.getElementById('chapter-content');
            content.style.fontSize = currentFontSize + 'px';
            
            // 保存到localStorage
            localStorage.setItem('reader-font-size', currentFontSize);
        }

        // 显示加载状态
        function showLoading() {
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        // 显示错误信息
        function showError(message) {
            hideLoading();
            document.getElementById('chapter-content').innerHTML = `
                <div style="text-align: center; color: #f44336; margin-top: 50px; padding: 20px; background: #ffebee; border-radius: 8px;">
                    <h3>错误</h3>
                    <p>${message}</p>
                    <button onclick="location.reload()" class="btn btn-primary" style="margin-top: 15px;">重试</button>
                </div>
            `;
            document.getElementById('chapter-navigation').style.display = 'none';
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (currentChapterIndex < 0) return;

            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    loadPrevChapter();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    loadNextChapter();
                    break;
                case '+':
                case '=':
                    e.preventDefault();
                    changeFontSize(1);
                    break;
                case '-':
                case '_':
                    e.preventDefault();
                    changeFontSize(-1);
                    break;
            }
        });

        // 恢复字体大小设置
        const savedFontSize = localStorage.getItem('reader-font-size');
        if (savedFontSize) {
            currentFontSize = parseInt(savedFontSize);
            document.getElementById('chapter-content').style.fontSize = currentFontSize + 'px';
        }

        // TTS 相关变量
        let ttsState = {
            isPlaying: false,
            isPaused: false,
            currentParagraph: 0,
            paragraphs: [],
            utterance: null,
            voices: [],
            selectedVoice: null,
            speed: 1.0,
            autoNextChapter: true
        };

        // 初始化 TTS
        function initTTS() {
            if ('speechSynthesis' in window) {
                // 加载语音列表
                loadVoices();
                
                // 监听语音列表变化
                speechSynthesis.addEventListener('voiceschanged', loadVoices);
                
                // 加载保存的设置
                loadTTSSettings();
                
                // 绑定事件监听器
                setupTTSListeners();
                
                console.log('TTS 初始化成功');
            } else {
                console.warn('浏览器不支持语音合成');
                updateTTSStatus('不支持');
            }
        }

        // 加载可用语音
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const voiceSelect = document.getElementById('tts-voice-select');
            
            // 筛选中文语音
            const chineseVoices = voices.filter(voice => 
                voice.lang.includes('zh') || voice.lang.includes('CN')
            );
            
            if (chineseVoices.length === 0) {
                // 如果没有中文语音，使用所有语音
                ttsState.voices = voices;
            } else {
                ttsState.voices = chineseVoices;
            }
            
            // 更新下拉列表
            voiceSelect.innerHTML = '';
            
            if (ttsState.voices.length === 0) {
                voiceSelect.innerHTML = '<option value="">无可用语音</option>';
                return;
            }
            
            ttsState.voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.default) {
                    option.selected = true;
                    ttsState.selectedVoice = voice;
                }
                voiceSelect.appendChild(option);
            });
            
            // 如果没有默认语音，选择第一个
            if (!ttsState.selectedVoice && ttsState.voices.length > 0) {
                ttsState.selectedVoice = ttsState.voices[0];
                voiceSelect.value = 0;
            }
        }

        // 设置 TTS 事件监听器
        function setupTTSListeners() {
            // 语音选择
            document.getElementById('tts-voice-select').addEventListener('change', function(e) {
                const voiceIndex = parseInt(e.target.value);
                if (voiceIndex >= 0 && voiceIndex < ttsState.voices.length) {
                    ttsState.selectedVoice = ttsState.voices[voiceIndex];
                    saveTTSSettings();
                }
            });
            
            // 语速调整
            document.getElementById('tts-speed-slider').addEventListener('input', function(e) {
                ttsState.speed = parseFloat(e.target.value);
                document.getElementById('tts-speed-value').textContent = ttsState.speed.toFixed(1) + 'x';
                saveTTSSettings();
            });
            
            // 自动下一章设置
            document.getElementById('tts-auto-next-chapter').addEventListener('change', function(e) {
                ttsState.autoNextChapter = e.target.checked;
                saveTTSSettings();
            });
        }

        // 切换 TTS 面板显示
        function toggleTTSPanel() {
            const panel = document.getElementById('tts-controls');
            const toggleBtn = document.getElementById('tts-toggle-btn');
            
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                toggleBtn.classList.add('active');
                
                // 如果还没有初始化 TTS，现在初始化
                if (ttsState.voices.length === 0) {
                    initTTS();
                }
                
                // 如果当前有章节内容，准备 TTS
                if (currentChapterIndex >= 0) {
                    prepareTTS();
                }
            } else {
                panel.style.display = 'none';
                toggleBtn.classList.remove('active');
            }
        }

        // 获取当前可见的段落索引
        function getFirstVisibleParagraph() {
            const chapterContent = document.querySelector('.reader-content');
            const paragraphs = chapterContent.querySelectorAll('p');
            const contentRect = chapterContent.getBoundingClientRect();
            
            for (let i = 0; i < paragraphs.length; i++) {
                const paragraph = paragraphs[i];
                const rect = paragraph.getBoundingClientRect();
                
                // 检查段落是否在可视区域内
                if (rect.bottom > contentRect.top && rect.top < contentRect.bottom) {
                    // 如果段落至少有一部分在可视区域内，返回该段落索引
                    return i;
                }
            }
            
            // 如果没有可见段落，返回第一个段落
            return 0;
        }

        // 准备 TTS
        function prepareTTS() {
            const chapterContent = document.getElementById('chapter-content');
            const paragraphs = chapterContent.querySelectorAll('p');
            
            if (paragraphs.length === 0) {
                updateTTSStatus('无内容');
                return;
            }
            
            // 提取段落文本
            ttsState.paragraphs = Array.from(paragraphs).map(p => p.textContent.trim()).filter(text => text);
            ttsState.currentParagraph = 0;
            
            // 启用播放按钮
            document.getElementById('tts-play-btn').disabled = false;
            document.getElementById('tts-stop-btn').disabled = false;
            
            updateTTSStatus('准备就绪');
            updateTTSProgress(0, ttsState.paragraphs.length);
        }

        // 切换播放/暂停
        function toggleTTSPlay() {
            if (ttsState.isPlaying && !ttsState.isPaused) {
                pauseTTS();
            } else {
                startTTS();
            }
        }

        // 开始 TTS
        function startTTS() {
            if (ttsState.paragraphs.length === 0) {
                showError('没有可朗读的内容');
                return;
            }
            
            if (ttsState.isPaused) {
                // 继续播放
                speechSynthesis.resume();
                ttsState.isPaused = false;
                ttsState.isPlaying = true;
                updateTTSStatus('播放中');
                updateTTSButtons();
                return;
            }
            

            // 开始新的朗读 - 从当前可见段落开始
            if (ttsState.currentParagraph >= ttsState.paragraphs.length) {
                // 如果当前段落超出范围，获取可见段落
                ttsState.currentParagraph = getFirstVisibleParagraph();
            } else if (ttsState.currentParagraph === 0) {
                // 如果是从头开始，也要获取可见段落
                ttsState.currentParagraph = getFirstVisibleParagraph();
            }
            speakCurrentParagraph();
        }

        // 朗读当前段落
        function speakCurrentParagraph() {
            if (ttsState.currentParagraph >= ttsState.paragraphs.length) {
                // 当前章节朗读完毕
                if (ttsState.autoNextChapter && currentChapterIndex < chapters.length - 1) {
                    // 自动加载下一章
                    loadNextChapterForTTS();
                } else {
                    // 停止朗读
                    stopTTS();
                }
                return;
            }
            
            const text = ttsState.paragraphs[ttsState.currentParagraph];
            
            // 创建语音合成实例
            ttsState.utterance = new SpeechSynthesisUtterance(text);
            ttsState.utterance.voice = ttsState.selectedVoice;
            ttsState.utterance.rate = ttsState.speed;
            ttsState.utterance.lang = ttsState.selectedVoice ? ttsState.selectedVoice.lang : 'zh-CN';
            
            // 设置事件监听器
            ttsState.utterance.onstart = function() {
                ttsState.isPlaying = true;
                ttsState.isPaused = false;
                updateTTSStatus('播放中');
                updateTTSButtons();
                highlightCurrentParagraph();
            };
            
            ttsState.utterance.onend = function() {
                ttsState.currentParagraph++;
                updateTTSProgress(ttsState.currentParagraph, ttsState.paragraphs.length);
                removeHighlight();
                
                // 继续下一段
                setTimeout(() => {
                    if (ttsState.isPlaying) {
                        speakCurrentParagraph();
                    }
                }, 100);
            };
            
            ttsState.utterance.onerror = function(event) {
                console.error('TTS 错误:', event);
                //showError('语音朗读出错');
                stopTTS();
            };
            
            // 开始朗读
            speechSynthesis.speak(ttsState.utterance);
        }

        // 暂停 TTS
        function pauseTTS() {
            if (speechSynthesis.speaking && !speechSynthesis.pending) {
                speechSynthesis.pause();
                ttsState.isPaused = true;
                ttsState.isPlaying = false;
                updateTTSStatus('已暂停');
                updateTTSButtons();
            }
        }

        // 停止 TTS
        function stopTTS() {
            speechSynthesis.cancel();
            ttsState.isPlaying = false;
            ttsState.isPaused = false;
            ttsState.currentParagraph = 0;
            removeHighlight();
            updateTTSStatus('已停止');
            updateTTSButtons();
            updateTTSProgress(0, ttsState.paragraphs.length);
        }

        // 为 TTS 加载下一章
        function loadNextChapterForTTS() {
            if (currentChapterIndex < chapters.length - 1) {
                const nextIndex = currentChapterIndex + 1;
                
                // 显示提示
                updateTTSStatus('加载下一章...');
                
                // 加载下一章
                loadChapter(nextIndex).then(() => {
                    // 延迟后继续朗读
                    setTimeout(() => {
                        if (ttsState.isPlaying) {
                            prepareTTS();
                            startTTS();
                        }
                    }, 1000);
                }).catch(error => {
                    console.error('加载下一章失败:', error);
                    stopTTS();
                });
            } else {
                // 已经是最后一章
                stopTTS();
                updateTTSStatus('朗读完成');
            }
        }

        // 高亮当前段落
        function highlightCurrentParagraph() {
            removeHighlight();
            const paragraphs = document.getElementById('chapter-content').querySelectorAll('p');
            if (paragraphs[ttsState.currentParagraph]) {
                paragraphs[ttsState.currentParagraph].classList.add('tts-highlight');
                // 滚动到当前段落
                paragraphs[ttsState.currentParagraph].scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }
        }

        // 移除高亮
        function removeHighlight() {
            const highlighted = document.querySelectorAll('.tts-highlight');
            highlighted.forEach(element => element.classList.remove('tts-highlight'));
        }

        // 更新 TTS 状态
        function updateTTSStatus(status) {
            const statusElement = document.getElementById('tts-status');
            statusElement.textContent = status;
            
            // 更新状态样式
            statusElement.className = 'tts-status';
            if (status === '播放中') {
                statusElement.classList.add('playing');
            } else if (status === '已暂停') {
                statusElement.classList.add('paused');
            }
        }

        // 更新 TTS 按钮状态
        function updateTTSButtons() {
            const playBtn = document.getElementById('tts-play-btn');
            const pauseBtn = document.getElementById('tts-pause-btn');
            const stopBtn = document.getElementById('tts-stop-btn');
            
            if (ttsState.isPlaying && !ttsState.isPaused) {
                playBtn.disabled = true;
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
                playBtn.innerHTML = '<span>▶️</span><span>播放</span>';
            } else if (ttsState.isPaused) {
                playBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = false;
                playBtn.innerHTML = '<span>▶️</span><span>继续</span>';
            } else {
                playBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                playBtn.innerHTML = '<span>▶️</span><span>播放</span>';
            }
        }

        // 更新 TTS 进度
        function updateTTSProgress(current, total) {
            const progressFill = document.getElementById('tts-progress-fill');
            const progressText = document.getElementById('tts-progress-text');
            
            const percentage = total > 0 ? (current / total) * 100 : 0;
            progressFill.style.width = percentage + '%';
            
            if (current === 0 && total === 0) {
                progressText.textContent = '准备就绪';
            } else {
                progressText.textContent = `${current} / ${total} 段`;
            }
        }

        // 保存 TTS 设置
        function saveTTSSettings() {
            const settings = {
                voiceIndex: ttsState.voices.indexOf(ttsState.selectedVoice),
                speed: ttsState.speed,
                autoNextChapter: ttsState.autoNextChapter
            };
            localStorage.setItem('tts-settings', JSON.stringify(settings));
        }

        // 加载 TTS 设置
        function loadTTSSettings() {
            const saved = localStorage.getItem('tts-settings');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    
                    // 设置语速
                    if (settings.speed) {
                        ttsState.speed = settings.speed;
                        document.getElementById('tts-speed-slider').value = settings.speed;
                        document.getElementById('tts-speed-value').textContent = settings.speed.toFixed(1) + 'x';
                    }
                    
                    // 设置自动下一章
                    if (settings.autoNextChapter !== undefined) {
                        ttsState.autoNextChapter = settings.autoNextChapter;
                        document.getElementById('tts-auto-next-chapter').checked = settings.autoNextChapter;
                    }
                    
                    // 语音设置需要在语音列表加载后设置
                    setTimeout(() => {
                        if (settings.voiceIndex >= 0 && settings.voiceIndex < ttsState.voices.length) {
                            ttsState.selectedVoice = ttsState.voices[settings.voiceIndex];
                            document.getElementById('tts-voice-select').value = settings.voiceIndex;
                        }
                    }, 100);
                    
                } catch (error) {
                    console.error('加载 TTS 设置失败:', error);
                }
            }
        }

        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            // 只在有章节内容时响应
            if (currentChapterIndex < 0) return;
            
            // 防止在输入框中触发
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            switch(e.key) {
                case ' ': // 空格键 - 播放/暂停
                    e.preventDefault();
                    if (document.getElementById('tts-controls').style.display !== 'none') {
                        toggleTTSPlay();
                    }
                    break;
                case 'Escape': // ESC - 停止
                    if (document.getElementById('tts-controls').style.display !== 'none') {
                        stopTTS();
                    }
                    break;
            }
        });

        // 在页面加载完成后初始化 TTS
        document.addEventListener('DOMContentLoaded', function() {
            // 延迟初始化，确保语音合成 API 可用
            setTimeout(initTTS, 1000);
        });

        // 重写 displayChapter 函数以支持 TTS
        const originalDisplayChapter = displayChapter;
        displayChapter = function(chapterData) {
            originalDisplayChapter(chapterData);
            
            // 如果 TTS 面板是打开的，准备 TTS
            if (document.getElementById('tts-controls').style.display !== 'none') {
                setTimeout(prepareTTS, 1000);
            }
        };
    </script>
</body>
</html>
