<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <title>Z Reader</title>
    <link rel="icon" href="/static/icon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/static/icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">Z</div>
                <div>
                    <h1>Z Reader</h1>
                    <p>规则驱动的小说阅读工具</p>
                </div>
            </div>

            <nav class="tabs" aria-label="主导航">
                <button class="tab-btn active" onclick="switchTab('search', event)">搜索</button>
                <button class="tab-btn" onclick="switchTab('sources', event)">书源</button>
                <button class="tab-btn" onclick="switchTab('tasks', event)">任务</button>
                <button class="tab-btn" onclick="switchTab('files', event)">文件</button>
            </nav>
        </aside>

        <main class="main">
            <section class="topbar">
                <div>
                    <p class="eyebrow">Z Reader Lite</p>
                    <h2 id="page-title">搜索书籍</h2>
                </div>
                <div class="status-pill">Node.js</div>
            </section>

            <div id="search-tab" class="tab-content active">
                <section class="panel search-panel">
                    {% if announcement %}
                    <div class="announcement">
                        {{ announcement|safe }}
                    </div>
                    {% endif %}

                    <div class="section-head">
                        <div>
                            <h3>搜索书籍</h3>
                            <p>按书名或作者检索，可指定单一书源。</p>
                        </div>
                    </div>

                    <div class="search-form">
                        <input type="text" id="search-keyword" placeholder="输入书名或作者" class="input-field">
                        <select id="search-source" class="select-field">
                            <option value="">所有书源</option>
                        </select>
                        <button onclick="searchBooks()" class="btn btn-primary">搜索</button>
                    </div>

                    <div id="search-loading" class="loading" style="display: none;">
                        <div class="spinner"></div>
                        <p>搜索中...</p>
                    </div>

                    <div id="search-results" class="results-container"></div>
                </section>
            </div>

            <div id="sources-tab" class="tab-content">
                <section class="panel">
                    <div class="section-head">
                        <div>
                            <h3>书源管理</h3>
                            <p>查看规则状态，按需检查可用性。</p>
                        </div>
                        <button onclick="checkAllSources()" class="btn btn-primary">检查书源</button>
                    </div>
                    <div id="sources-loading" class="loading">
                        <div class="spinner"></div>
                        <p>加载中...</p>
                    </div>
                    <div id="check-summary" class="check-summary" style="display: none;"></div>
                    <div id="sources-list" class="sources-list"></div>
                </section>
            </div>

            <div id="tasks-tab" class="tab-content">
                <section class="panel">
                    <div class="section-head">
                        <div>
                            <h3>下载任务</h3>
                            <p>查看任务进度和下载状态。</p>
                        </div>
                        <button onclick="refreshTasks()" class="btn btn-secondary">刷新</button>
                    </div>
                    <div id="tasks-list" class="tasks-list"></div>
                </section>
            </div>

            <div id="files-tab" class="tab-content">
                <section class="panel">
                    <div class="section-head">
                        <div>
                            <h3>文件管理</h3>
                            <p>管理已生成的 TXT 和 EPUB 文件。</p>
                        </div>
                        <button onclick="refreshFiles()" class="btn btn-secondary">刷新</button>
                    </div>
                    <div id="files-list" class="files-list"></div>
                </section>
            </div>
        </main>
    </div>

    <div id="download-modal" class="modal">
        <div class="modal-content">
            <button class="close" onclick="closeDownloadModal()" aria-label="关闭">&times;</button>
            <h3>下载设置</h3>
            <div class="form-group">
                <label>书籍 URL</label>
                <input type="text" id="download-url" class="input-field" readonly>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>书名</label>
                    <input type="text" id="download-book-name" class="input-field" readonly>
                </div>
                <div class="form-group">
                    <label>作者</label>
                    <input type="text" id="download-author" class="input-field" readonly>
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>输出格式</label>
                    <select id="download-format" class="select-field">
                        <option value="txt">TXT 文本</option>
                        <option value="epub">EPUB 电子书</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>起始章节</label>
                    <input type="number" id="download-start" class="input-field" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>结束章节</label>
                    <input type="number" id="download-end" class="input-field" value="-1">
                </div>
            </div>
            <input type="hidden" id="download-source-id">
            <button onclick="startDownload()" class="btn btn-primary btn-full">开始下载</button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
